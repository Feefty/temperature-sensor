services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Not published to the host: the browser only ever reaches the API through nginx (same-origin),
    # so it cannot bypass the proxy's hardening. `web` reaches it in-network as `api`.
    expose:
      - '3000'
    environment:
      PORT: 3000
      NODE_ENV: production
    # Health comes from the image's HEALTHCHECK (api/Dockerfile); `web` waits on it below.
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - '8080:8080'
    # nginx proxies /api to the api service, so wait until it is healthy.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
