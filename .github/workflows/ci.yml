name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so a push to a PR branch does not pile up jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Build and run the stack the way it ships, then probe it end-to-end through nginx.
      - run: docker compose up -d --build --wait
      - run: npm run smoke
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down
