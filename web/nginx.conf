server {
  # Unprivileged nginx listens high so the container can run as a non-root user.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS, re-resolved on a TTL so a recreated api container (new IP) is picked up
  # instead of nginx caching the first-seen address for its lifetime.
  resolver 127.0.0.11 valid=10s;

  # Baseline hardening for the HTML document and API responses (no CSP: the shell runs a small
  # inline theme script). Repeated in /assets/ since a block with its own add_header drops these.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The shell must never be cached, or a returning user gets a stale index.html pointing at asset
  # hashes that 404 after a deploy. Security headers are re-emitted (a location with its own
  # add_header does not inherit the server-level ones).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # Hashed build assets are immutable, so let the browser keep them.
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Same-origin API: forward to the api service so the browser never deals with CORS. The upstream
  # goes through a variable so the resolver above re-resolves it per request.
  location /api/ {
    set $api_host api;
    proxy_pass http://$api_host:3000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
